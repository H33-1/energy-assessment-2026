const PAGES={"index":"\u003c!DOCTYPE html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\u003ctitle>발전소의 전기 생산 원리와 신재생 에너지\u003c/title>\n\u003cstyle>\n*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;background:#d9d3ca;font-family:\"NanumSquare\",\"Noto Sans CJK KR\",\"Apple SD Gothic Neo\",sans-serif}\nbody{display:flex;justify-content:center;align-items:flex-start}\n.page{position:relative;width:min(100vw,560px);aspect-ratio:941/1672;overflow:hidden;background:#f7efe3;container-type:inline-size}\n.page-bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none}\n\n/* input overlays */\n.input-overlay{position:absolute;z-index:20;margin:0;outline:none;border:0;background:transparent;color:#4d4742;font:600 3.1cqw/1 \"NanumSquare\",\"Noto Sans CJK KR\",sans-serif}\n.input-overlay::placeholder{color:#9a928b;opacity:1}\n.input-overlay:focus{box-shadow:inset 0 0 0 2px rgba(143,104,173,.28);border-radius:1.2cqw}\n#school{left:calc(17.45% + 3px);top:26.35%;width:53.75%;height:4.20%;padding:0 2.7%}\n#grade{left:calc(17.42% + 1px);top:33.55%;width:14.75%;height:3.70%;padding:0 2.2%}\n#classNo{left:calc(33.56% + 3px);top:33.55%;width:14.55%;height:3.70%;padding:0 2.2%}\n#studentNo{left:calc(49.50% + 3px);top:33.55%;width:13.25%;height:3.70%;padding:0 2.2%}\n#studentName{left:calc(64.60% + 3px);top:33.55%;width:22.05%;height:3.70%;padding:0 2.2%}\ninput[type=\"number\"]{appearance:textfield;-moz-appearance:textfield}input[type=\"number\"]::-webkit-inner-spin-button,input[type=\"number\"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n\n/* group buttons placed in the newly blank region */\n.group-btn{position:absolute;z-index:21;border:1.35px solid #6d6258;border-radius:1.65cqw;background:#fffaf2;color:#282421;font:900 3.35cqw/1 \"NanumSquare\",\"Noto Sans CJK KR\",sans-serif;cursor:pointer;padding:0;box-shadow:0 .25cqw .55cqw rgba(73,56,39,.05);transition:.14s ease}\n.group-btn:active{transform:scale(.98)}\n.group-btn.selected{background:#dfcbee;color:#312639;border-color:#946caf;box-shadow:inset 0 0 0 1.5px #946caf,0 0 0 .65cqw rgba(182,150,207,.18)}\n.group-btn.selected::before{content:\"✓\";display:inline-grid;place-items:center;width:4.5cqw;height:4.5cqw;margin-right:1.15cqw;border-radius:50%;background:#8d66ad;color:white;font-size:2.9cqw;vertical-align:middle}\n#g1{left:24.35%;top:45.05%;width:15.90%;height:3.45%}\n#g2{left:41.76%;top:45.05%;width:15.90%;height:3.45%}\n#g3{left:59.15%;top:45.05%;width:15.90%;height:3.45%}\n#g4{left:24.35%;top:49.25%;width:15.90%;height:3.45%}\n#g5{left:41.76%;top:49.25%;width:15.90%;height:3.45%}\n#g6{left:59.15%;top:49.25%;width:15.90%;height:3.45%}\n\n/* dynamic topic content: keep the illustrated background cards */\n.topic-icon{position:absolute;z-index:24;width:9.8%;height:5.7%;display:grid;place-items:center;pointer-events:none}\n.topic-icon svg,.topic-icon img{width:100%;height:100%;object-fit:contain;overflow:visible;filter:drop-shadow(0 .45cqw .45cqw rgba(76,58,41,.07))}\n#powerIcon{left:27.7%;top:65.30%}\n#renewIcon{left:63.0%;top:65.30%}\n.topic-value{position:absolute;z-index:25;display:flex;align-items:center;justify-content:center;padding:0 1.4%;background:#fff0dc;border-radius:1.7cqw;color:#302b27;text-align:center;font:900 2.95cqw/1.22 \"NanumSquare\",\"Noto Sans CJK KR\",sans-serif}\n#powerTopic{left:calc(17.55% + 3px);top:calc(69.78% + 5px);width:29.35%;height:3.25%}\n#renewTopic{left:calc(52.70% + 3px);top:calc(69.78% + 5px);width:29.65%;height:3.25%}\n.topic-value.placeholder{color:#aaa199;font-weight:700;font-size:2.55cqw}.topic-value.ocean-topic{white-space:nowrap}.topic-value .topic-main{font-size:1em}.topic-value .topic-sub{font-size:.72em;font-weight:800;letter-spacing:-.02em;white-space:nowrap}\n\n#startButton{position:absolute;z-index:30;left:29.6%;top:88.55%;width:40.9%;height:4.95%;border:0;padding:0;background:transparent;border-radius:999px;cursor:pointer}\n#startButton:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:-7px}\n.toast{position:fixed;z-index:999;left:50%;bottom:max(16px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),500px);padding:13px 16px;transform:translate(-50%,110px);opacity:0;border-radius:14px;background:rgba(43,38,34,.96);color:white;font-size:14px;font-weight:700;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:.24s ease}\n.toast.show{transform:translate(-50%,0);opacity:1}\n.invalid{box-shadow:inset 0 0 0 2px #d66666!important;border-radius:1.2cqw}\n@media(min-width:620px){body{padding:18px 0}.page{border-radius:32px;box-shadow:0 18px 45px rgba(0,0,0,.18)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cimg class=\"page-bg\" src=\"image-88e004d77429d86b4c09.png\" alt=\"\" draggable=\"false\">\n\n  \u003cinput id=\"school\" class=\"input-overlay\" type=\"text\" placeholder=\"학교명을 입력하세요\" autocomplete=\"organization\" aria-label=\"학교\">\n  \u003cinput id=\"grade\" class=\"input-overlay\" type=\"text\" inputmode=\"numeric\" pattern=\"[0-9]*\" maxlength=\"1\" placeholder=\"입력\" aria-label=\"학년\">\n  \u003cinput id=\"classNo\" class=\"input-overlay\" type=\"text\" inputmode=\"numeric\" pattern=\"[0-9]*\" maxlength=\"2\" placeholder=\"입력\" aria-label=\"반\">\n  \u003cinput id=\"studentNo\" class=\"input-overlay\" type=\"number\" min=\"1\" max=\"50\" inputmode=\"numeric\" placeholder=\"입력\" aria-label=\"번호\">\n  \u003cinput id=\"studentName\" class=\"input-overlay\" type=\"text\" placeholder=\"입력\" autocomplete=\"name\" aria-label=\"이름\">\n\n  \u003cbutton id=\"g1\" class=\"group-btn\" type=\"button\" data-group=\"1\">1모둠\u003c/button>\n  \u003cbutton id=\"g2\" class=\"group-btn\" type=\"button\" data-group=\"2\">2모둠\u003c/button>\n  \u003cbutton id=\"g3\" class=\"group-btn\" type=\"button\" data-group=\"3\">3모둠\u003c/button>\n  \u003cbutton id=\"g4\" class=\"group-btn\" type=\"button\" data-group=\"4\">4모둠\u003c/button>\n  \u003cbutton id=\"g5\" class=\"group-btn\" type=\"button\" data-group=\"5\">5모둠\u003c/button>\n  \u003cbutton id=\"g6\" class=\"group-btn\" type=\"button\" data-group=\"6\">6모둠\u003c/button>\n\n  \u003cdiv id=\"powerIcon\" class=\"topic-icon\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv id=\"renewIcon\" class=\"topic-icon\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv id=\"powerTopic\" class=\"topic-value placeholder\">모둠을 선택하세요\u003c/div>\n  \u003cdiv id=\"renewTopic\" class=\"topic-value placeholder\">모둠을 선택하세요\u003c/div>\n\n  \u003cbutton id=\"startButton\" type=\"button\" aria-label=\"수행평가 시작하기\">\u003c/button>\n\u003c/div>\n\u003cdiv id=\"toast\" class=\"toast\">\u003c/div>\n\n\u003cscript>\nconst ICONS = {\n  coal: 'image-bdb26559a42f352d81cb.png',\n  solar: 'image-a5971646e136c78a748a.png',\n  lng: 'image-1997266d8c478f86df8b.png',\n  wind: 'image-0df063bf067590a0dcc9.png',\n  nuclear: 'image-952adf1a114539394404.png',\n  hydrogen: 'image-2729895174ae2807450b.png',\n  hydro: 'image-d286ddbd755787b88f95.png',\n  geothermal: 'image-2f74327563a954ea1965.png',\n  pumped: 'image-842da6e1ad1e65ba05d8.png',\n  ocean: 'image-47cb3546aab122ee6267.png',\n  chp: 'image-8c1db9b27933cb560e11.png',\n  biomass: 'image-d706c4844b048f0cfcc9.png'\n};\n\nconst GROUP_DATA = {\n  1: {power:'석탄 화력 발전', renew:'태양광 발전', powerIcon:'coal', renewIcon:'solar'},\n  2: {power:'LNG 복합 화력 발전', renew:'풍력 발전', powerIcon:'lng', renewIcon:'wind'},\n  3: {power:'원자력 발전', renew:'수소·연료 전지', powerIcon:'nuclear', renewIcon:'hydrogen'},\n  4: {power:'수력 발전', renew:'지열 발전', powerIcon:'hydro', renewIcon:'geothermal'},\n  5: {power:'양수 발전', renew:'해양 에너지 (조력·파력)', powerIcon:'pumped', renewIcon:'ocean'},\n  6: {power:'열병합 발전', renew:'바이오 에너지', powerIcon:'chp', renewIcon:'biomass'}\n};\n\nlet selectedGroup=null, toastTimer=null;\nconst groupButtons=[...document.querySelectorAll('.group-btn')];\nconst powerTopic=document.getElementById('powerTopic');\nconst renewTopic=document.getElementById('renewTopic');\nconst powerIcon=document.getElementById('powerIcon');\nconst renewIcon=document.getElementById('renewIcon');\nconst toast=document.getElementById('toast');\n\nfunction showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}\nfunction clearTopic(){powerTopic.textContent='모둠을 선택하세요';renewTopic.textContent='모둠을 선택하세요';powerTopic.classList.add('placeholder');renewTopic.classList.add('placeholder');powerTopic.classList.remove('ocean-topic');renewTopic.classList.remove('ocean-topic');powerIcon.innerHTML='';renewIcon.innerHTML=''}\nfunction setTopicLabel(el,text){\n  el.classList.remove('ocean-topic');\n  if(text==='해양 에너지 (조력·파력)'){\n    el.classList.add('ocean-topic');\n    el.innerHTML='\u003cspan class=\"topic-main\">해양 에너지\u003c/span> \u003cspan class=\"topic-sub\">(조력·파력)\u003c/span>';\n  }else{\n    el.textContent=text;\n  }\n}\nfunction setIcon(container,path,alt){container.innerHTML='\u003cimg src=\"'+path+'\" alt=\"'+alt+'\">'}\nfunction chooseGroup(n){selectedGroup=Number(n);groupButtons.forEach(b=>b.classList.toggle('selected',Number(b.dataset.group)===selectedGroup));const d=GROUP_DATA[selectedGroup];setTopicLabel(powerTopic,d.power);setTopicLabel(renewTopic,d.renew);powerTopic.classList.remove('placeholder');renewTopic.classList.remove('placeholder');setIcon(powerIcon,ICONS[d.powerIcon],d.power);setIcon(renewIcon,ICONS[d.renewIcon],d.renew);saveDraft()}\ngroupButtons.forEach(btn=>btn.addEventListener('click',()=>chooseGroup(btn.dataset.group)));\n\nfunction getFormData(){return{school:document.getElementById('school').value.trim(),grade:document.getElementById('grade').value,classNo:document.getElementById('classNo').value,number:document.getElementById('studentNo').value,name:document.getElementById('studentName').value.trim(),group:selectedGroup,powerPlant:selectedGroup?GROUP_DATA[selectedGroup].power:'',renewable:selectedGroup?GROUP_DATA[selectedGroup].renew:''}}\n\n// 브라우저가 file:// 환경에서 localStorage를 막아도 화면 동작은 멈추지 않도록 안전 처리\nlet memoryDraft = null;\nfunction saveDraft(){\n  const data = getFormData();\n  memoryDraft = data;\n  try{\n    localStorage.setItem('energyAssessmentStudent',JSON.stringify(data));\nlocalStorage.setItem('page1Data',JSON.stringify({...data,studentName:data.name,classNumber:data.classNo,studentNumber:data.number,groupNumber:data.group,studentId:String(Number(data.grade))+String(Number(data.classNo)).padStart(2,'0')+String(Number(data.number)).padStart(2,'0')}));\n    return true;\n  }catch(e){\n    console.warn('임시저장(localStorage)을 사용할 수 없습니다.', e);\n    return false;\n  }\n}\nfunction loadDraft(){\n  try{\n    const raw = localStorage.getItem('energyAssessmentStudent');\n    if(raw) return JSON.parse(raw);\n  }catch(e){\n    console.warn('임시저장 정보를 불러올 수 없습니다.', e);\n  }\n  return memoryDraft;\n}\n\n['school','grade','classNo','studentNo','studentName'].forEach(id=>{\n  const el=document.getElementById(id);\n  if(!el) return;\n  el.addEventListener('input',()=>{ saveDraft(); });\n  el.addEventListener('change',()=>{ saveDraft(); });\n});\n\nfunction validate(){\n  document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));\n  const req=[['school','학교'],['grade','학년'],['classNo','반'],['studentNo','번호'],['studentName','이름']];\n  for(const [id,label] of req){\n    const el=document.getElementById(id);\n    if(!el || !String(el.value).trim()){\n      if(el){ el.classList.add('invalid'); el.focus(); }\n      showToast(label+'을(를) 입력해 주세요.');\n      return false;\n    }\n  }\n  if(!selectedGroup){\n    showToast('모둠을 선택해 주세요.');\n    return false;\n  }\n  return true;\n}\n\ndocument.getElementById('startButton').addEventListener('click',()=>{\n  if(!validate()) return;\n  const stored = saveDraft();\n  const d = getFormData();\n  showToast(stored ? d.name+' 학생의 정보가 저장되었습니다.' : d.name+' 학생의 입력이 완료되었습니다.');\n  setTimeout(()=>parent.postMessage({kind:'navigate',page:'page2'},'*'),200);\n});\n\nwindow.addEventListener('DOMContentLoaded',()=>{\n  clearTopic();\n  const d = loadDraft();\n  if(!d) return;\n  document.getElementById('school').value=d.school||'';\n  document.getElementById('grade').value=d.grade||'';\n  document.getElementById('classNo').value=d.classNo||'';\n  document.getElementById('studentNo').value=d.number||d.studentNo||'';\n  document.getElementById('studentName').value=d.name||d.studentName||'';\n  if(d.group) chooseGroup(d.group);\n});\n\u003c/script>\n\u003caside id=\"draftBar\" style=\"display:none;position:fixed;bottom:10px;right:10px;z-index:900;background:#fffaf3f5;border:1px solid #baa1d6;border-radius:12px;padding:8px 10px;box-shadow:0 2px 8px #0002;font:13px system-ui,sans-serif;display:none;gap:8px;align-items:center;max-width:calc(100vw - 20px)\">\u003cspan id=\"draftState\" role=\"status\" aria-live=\"polite\">작성 내용은 이 기기에 자동 임시저장됩니다.\u003c/span>\u003cbutton id=\"saveNow\" type=\"button\" style=\"white-space:nowrap;border:1px solid #baa1d6;border-radius:8px;background:#f1e8fc;padding:6px 9px;font:inherit;cursor:pointer\">지금 저장\u003c/button>\u003c/aside>\u003cscript>\n(function(){const state=document.getElementById('draftState');let timer;new MutationObserver(()=>parent.postMessage({kind:'draft',page:'index',text:state.textContent},'*')).observe(state,{childList:true,subtree:true});parent.postMessage({kind:'draft',page:'index',text:state.textContent},'*');\nfunction storeDraft(){try{const ok=typeof saveDraft==='function'?saveDraft():typeof save==='function'?save():false;if(ok){const time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Seoul'});state.textContent='임시저장 완료 · '+time;localStorage.setItem('energyDraftSavedAt',new Date().toISOString());}else state.textContent='저장하지 못했습니다. 기기 저장 공간을 확인해 주세요.';}catch(error){state.textContent='저장하지 못했습니다. 브라우저 설정을 확인해 주세요.';}}\ndocument.addEv st STORAGE_KEY='page3Data';\nconst fields=[...document.querySelectorAll('[data-key]')];\nconst status=document.getElementById('status'),preview=document.getElementById('preview');\nconst dialog=document.getElementById('artDialog'),photoPreview=document.getElementById('photoPreview');\nlet art='',artMode='',draft='',loading=false;\nfunction showArt(){document.getElementById('photoHint').hidden=!!art;preview.hidden=!art;if(art)preview.src=art;else preview.removeAttribute('src');}\nfunction save(){const data={version:1,...Object.fromEntries(fields.map(el=>[el.dataset.key,el.value])),flow:document.querySelector('[name=\"flow\"]:checked')?.value||'',art,artMode};try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));status.textContent='';return true;}catch(e){status.textContent='기기에 저장하지 못했습니다. 저장 공간 또는 브라우저 설정을 확인해 주세요.';return false;}}\ntry{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');fields.forEach(el=>el.value=typeof data[el.dataset.key]==='string'?data[el.dataset.key]:'');document.querySelectorAll('[name=\"flow\"]').forEach(el=>el.checked=el.value===data.flow);art=typeof data.art==='string'&&data.art.startsWith('data:image/')?data.art:'';artMode=data.artMode||'';showArt();}catch(e){status.textContent='이전에 저장한 데이터를 불러오지 못했습니다.';}\nfields.forEach(el=>{if(!el.readOnly)el.addEventListener('input',save);});document.querySelectorAll('[name=\"flow\"]').forEach(el=>el.addEventListener('change',save));\n// 위쪽 핵심 질문을 아래쪽 읽기 전용 영역에도 함께 표시합니다.\nconst question=document.querySelector('[data-key=\"question\"]'),questionCopy=document.querySelector('[data-key=\"questionCopy\"]');\nquestionCopy.value=question.value;question.addEventListener('input',()=>{questionCopy.value=question.value;save();});\nfunction showDraft(){photoPreview.hidden=!draft;if(draft)photoPreview.src=draft;else photoPreview.removeAttribute('src');}\nconst apply=document.getElementById('apply'),artStatus=document.getElementById('artStatus');\ndocument.getElementById('openArt').onclick=()=>{draft=art;showDraft();artStatus.textContent='';dialog.showModal();};\ndocument.getElementById('takePhoto').onclick=()=>document.getElementById('camera').click();\ndocument.getElementById('choosePhoto').onclick=()=>document.getElementById('file').click();\nasync function loadPhoto(event){\n const file=event.target.files[0];event.target.value='';if(!file)return;\n if(!file.type.startsWith('image/')){artStatus.textContent='사진 파일을 선택해 주세요.';return;}\n if(file.size>25*1024*1024){artStatus.textContent='25MB 이하 사진을 선택해 주세요.';return;}\n loading=true;apply.disabled=true;artStatus.textContent='사진을 불러오는 중입니다.';\n const url=URL.createObjectURL(file);\n try{const img=new Image();img.src=url;await img.decode();\n // 휴대폰 사진은 비율을 유지해 줄여 기기 저장 공간을 절약합니다.\n const buffer=document.createElement('canvas'),ratio=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));\n buffer.width=Math.max(1,Math.round(img.naturalWidth*ratio));buffer.height=Math.max(1,Math.round(img.naturalHeight*ratio));\n const context=buffer.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,buffer.width,buffer.height);context.drawImage(img,0,0,buffer.width,buffer.height);\n draft=buffer.toDataURL('image/jpeg',0.82);showDraft();artStatus.textContent='사진을 확인한 뒤 적용해 주세요.';\n }catch(error){artStatus.textContent='사진을 열 수 없습니다. JPG 또는 PNG 사진으로 다시 선택해 주세요.';}\n finally{URL.revokeObjectURL(url);loading=false;apply.disabled=false;}\n}\ndocument.getElementById('camera').onchange=loadPhoto;document.getElementById('file').onchange=loadPhoto;\ndocument.getElementById('removePhoto').onclick=()=>{if(loading)return;draft='';showDraft();artStatus.textContent='사진 적용을 누르면 삭제됩니다.';};\napply.onclick=()=>{if(loading)return;const previous=art;art=draft;artMode=art?'upload':'';if(save()){showArt();dialog.close();}else{art=previous;artStatus.textContent='저장하지 못했습니다. 더 작은 사진을 선택해 주세요.';}};\ndocument.getElementById('cancel').onclick=()=>dialog.close();\n// 같은 폴더에 page4.html과 index.html을 넣으면 연결됩니다.\ndocument.getElementById('ne utions\" value=\"스마트 그리드\" aria-label=\"발전량 변동 해결 방법 스마트 그리드\" style=\"left:42.9%;top:56.1%;width:2.2%;height:1.3%\">\u003cinput class=\"option\" type=\"checkbox\" name=\"solutions\" value=\"다른 발전원과 연계\" aria-label=\"발전량 변동 해결 방법 다른 발전원과 연계\" style=\"left:56.8%;top:56.1%;width:2.2%;height:1.3%\">\u003cinput class=\"option\" type=\"checkbox\" name=\"solutions\" value=\"기타\" aria-label=\"발전량 변동 해결 방법 기타\" style=\"left:75%;top:56.1%;width:2.2%;height:1.3%\">\u003ctextarea class=\"field\" data-key=\"solutionOther\" aria-label=\"기타 해결 방법\"  style=\"left:78.5%;top:58%;width:16.6%;height:1.7%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"solutionDetail\" aria-label=\"발전량 변동 문제 해결 방법 구체적으로 설명하기\"  style=\"left:9.4%;top:60.8%;width:80.8%;height:4.7%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"before\" aria-label=\"2페이지에서 작성한 탐구 전 내 생각\" readonly style=\"left:9.2%;top:73.5%;width:32.9%;height:6%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"afterThought\" aria-label=\"탐구 후 새롭게 알게 되었거나 생각이 바뀐 점\" style=\"left:51.2%;top:72.5%;width:43.4%;height:6.7%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"reflection1\" aria-label=\"모둠원 1의 탐구 후 생각\" readonly style=\"left:20.2%;top:83.1%;width:70.9%;height:1.65%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"reflection2\" aria-label=\"모둠원 2의 탐구 후 생각\" readonly style=\"left:20.2%;top:85.39%;width:70.9%;height:1.65%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"reflection3\" aria-label=\"모둠원 3의 탐구 후 생각\" readonly style=\"left:20.2%;top:87.67999999999999%;width:70.9%;height:1.65%\">\u003c/textarea>\u003ctextarea class=\"field\" data-key=\"reflection4\" aria-label=\"모둠원 4의 탐구 후 생각\" readonly style=\"left:20.2%;top:89.97%;width:70.9%;height:1.65%\">\u003c/textarea>\u003cbutton class=\"hit\" id=\"home\" aria-label=\"첫 페이지로 이동\" style=\"left:3.2%;top:1%;width:5.7%;height:3%\">\u003c/button>\u003cbutton class=\"hit\" id=\"submit\" aria-label=\"전체 답안 저장 및 제출 확인\" style=\"left:68.2%;top:93.7%;width:28.9%;height:3.8%\">\u003c/button>\u003c/main>\u003cp id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n\u003cdialog id=\"result\" aria-labelledby=\"resultTitle\">\u003ch2 id=\"resultTitle\">답안 파일 저장\u003c/h2>\u003cp>전체 페이지의 답안을 이 기기에 저장했습니다. 내려받은 파일을 선생님이 안내한 제출처에 제출하세요.\u003c/p>\u003cp>온라인 전송은 연결되지 않았습니다.\u003c/p>\u003cdiv class=\"tools\">\u003cbutton id=\"downloadAgain\">답안 파일 다시 받기\u003c/button>\u003cbutton id=\"closeResult\">돌아가기\u003c/button>\u003c/div>\u003c/dialog>\n\u003cscript>\n'use strict';\nconst KEY='page6Data',fields=[...document.querySelectorAll('[data-key]')],options=[...document.querySelectorAll('.option')],status=document.getElementById('status');\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,...Object.fromEntries(fields.filter(el=>el.dataset.key!=='before').map(el=>[el.dataset.key,el.value])),energy:options.find(el=>el.name==='energy'&&el.checked)?.value||'',conditions:options.filter(el=>el.name==='conditions'&&el.checked).map(el=>el.value),solutions:options.filter(el=>el.name==='solutions'&&el.checked).map(el=>el.value)}));status.textContent='';return true;}catch(error){status.textContent='저장하지 못했습니다. 브라우저 저장 공간 또는 설정을 확인해 주세요.';return false;}}\ntry{const data=JSON.parse(localStorage.getItem(KEY)||'{}');fields.forEach(el=>{if(el.dataset.key!=='before')el.value=typeof data[el.dataset.key]==='string'?data[el.dataset.key]:'';});options.forEach(el=>el.checked=el.name==='energy'?el.value===data.energy:Array.isArray(data[el.name])&&data[el.name].includes(el.value));const before=JSON.parse(localStorage.getItem('page2Data')||'{}');document.querySelector('[data-key=before]').value=typeof before.myThought==='string'?before.myThought:'';}catch(error){status.textContent='저장한 답안을 불러오지 못했습니다.';}\n// 공유 저장소 연결 시 모둠원들의 탐구 후 생각을 전달하세요. 학생이 직접 수정할 수 없는 표시 영역입니다.\nwindow.setSharedReflections=function(values){for(let i=0;i\u003c4;i++){document.querySelector('[data-key=reflection'+(i+1)+']').value=String(values[i]||'');}save();};\nconst proposal=document.querySelector('[data-key=proposal]');\nfunction sentenceCount(){const text=proposal.value.trim();return text?text.split(/[.!?。！？]+(?:\\s*|$)|\\n+/u).filter(s=>s.trim()).length:0;}\nfunction updateCount(){document.getElementById('sentenceCount').textContent='현재 '+sentenceCount()+'문장 / 최소 8문장';}\nfields.forEach(el=>{if(!el.readOnly)el.addEventListener('input',()=>{el.removeAttribute('aria-invalid');updateCount();save();});});options.forEach(el=>el.addEventListener('change',save));updateCount();\ntry{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(!old.afterThought&&old.reflection1){document.querySelector('[data-key=afterThought]').value=old.reflection1;document.querySelector('[data-key=reflection1]').value='';save();}}catch(error){}\nlet finalPayload='';\nfunction download(){const blob=new Blob([finalPayload],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='에너지_탐구_전체답안_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}\nfunction fail(message,el){status.textContent=message;el?.setAttribute('aria-invalid','true');el?.focus();el?.scrollIntoView({block:'center',behavior:'smooth'});}\ndocument.getElementById('submit').onclick=()=>{if(!save())return;if(!options.some(el=>el.name==='energy'&&el.checked)){fail('우리 지역에 적합한 신재생 에너지를 선택해 주세요.',document.querySelector('[name=energy]'));return;}if(!options.some(el=>el.name==='conditions'&&el.checked)){fail('활용한 자연 조건을 선택해 주세요.',document.querySelector('[name=conditions]'));return;}if(sentenceCount()\u003c8){fail('우리 모둠의 제안을 8문장 이상 작성해 주세요. 문장 끝에 마침표를 넣어 주세요.',proposal);return;}const detail=document.querySelector('[data-key=solutionDetail]');if(!detail.value.trim()){fail('발전량 변동 문제 해결 방법을 구체적으로 설명해 주세요.',detail);return;}\ntry{const pages={};for(let i=1;i\u003c=6;i++){const raw=localStorage.getItem('page'+i+'Data');if(raw)pages['page'+i]=JSON.parse(raw);}parent.submitAssessment(pages).catch(error=>{status.textContent='제출하지 못했습니다. '+error.message;});}catch(error){status.textContent='전체 답안 파일을 만들지 못했습니다. 저장한 내용을 확인해 주세요.';}};\ndocument.getElementById('downloadAgain').onclick=download;document.getElementById('closeResult').onclick=()=>document.getElementById('result').close();document.getElementById('home').onclick=()=>{if(save())parent.postMessage({kind:'navigate',page:'index'},'*');};\n// 온라인 제출 연결 시 위 submit 처리에서 서버로 전송하고, 성공 응답 후 완료 화면으로 이동하세요.\n\u003c/script>\u003caside id=\"draftBar\" style=\"display:none;position:fixed;bottom:10px;right:10px;z-index:900;background:#fffaf3f5;border:1px solid #baa1d6;border-radius:12px;padding:8px 10px;box-shadow:0 2px 8px #0002;font:13px system-ui,sans-serif;display:none;gap:8px;align-items:center;max-width:calc(100vw - 20px)\">\u003cspan id=\"draftState\" role=\"status\" aria-live=\"polite\">작성 내용은 이 기기에 자동 임시저장됩니다.\u003c/span>\u003cbutton id=\"saveNow\" type=\"button\" style=\"white-space:nowrap;border:1px solid #baa1d6;border-radius:8px;background:#f1e8fc;padding:6px 9px;font:inherit;cursor:pointer\">지금 저장\u003c/button>\u003c/aside>\u003cscript>\n(function(){const state=document.getElementById('draftState');let timer;new MutationObserver(()=>parent.postMessage({kind:'draft',page:'page6',text:state.textContent},'*')).observe(state,{childList:true,subtree:true});parent.postMessage({kind:'draft',page:'page6',text:state.textContent},'*');\nfunction storeDraft(){try{const ok=typeof saveDraft==='function'?saveDraft():typeof save==='function'?save():false;if(ok){const time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Seoul'});state.textContent='임시저장 완료 · '+time;localStorage.setItem('energyDraftSavedAt',new Date().toISOString());}else state.textContent='저장하지 못했습니다. 기기 저장 공간을 확인해 주세요.';}catch(error){state.textContent='저장하지 못했습니다. 브라우저 설정을 확인해 주세요.';}}\ndocument.addEventListener('input',event=>{if(event.target.matches('input,textar window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data?.kind==='draft'){const label=document.getElementById('draftLabel'),text=String(e.data.text||'');label.title=text;label.setAttribute('aria-label',text);label.textContent=text.includes('못했')?'저장 실패':text.includes('저장 중')?'저장 중…':text.includes('저장 완료')?'저장됨'+(text.includes(' · ')?' · '+text.split(' · ').pop():''):text.includes('불러왔')?'불러옴':'자동저장';}if(e.data?.kind==='navigate'){if(window.requestPageNavigation)window.requestPageNavigation(e.data.page);else openPage(e.data.page);}if(e.data?.kind==='height'&&Number.isFinite(e.data.height))frame.style.height=Math.ceil(e.data.height)+'px';});
document.getElementById('manualSave').onclick=()=>frame.contentDocument.getElementById('saveNow')?.click();select.onchange=()=>openPage(select.value);document.getElementById('previous').onclick=()=>openPage(order[order.indexOf(current)-1]);document.getElementById('forward').onclick=()=>openPage(order[order.indexOf(current)+1]);window.addEventListener('popstate',()=>openPage(location.hash.slice(1)||'index',false));openPage(location.hash.slice(1)||'index',false);
</script><script>/* 페이지 이동은 로컬 저장 직후 처리하고, 시트 저장은 하나의 최신 작업으로 합쳐 전송합니다. */
(function(){
'use strict';
const ENDPOINT='https://script.google.com/macros/s/AKfycbxl2lIw77J7OvQERHad-Fg6f7LT5JlUiwmsSx4OhXcDFNP6kLV6qh1Wcu1a_cnpAGM/exec';
const OUTBOX='energyPendingSync',LAST='energyLastSynced',PHOTOS='energyUploadedPhotos';
const state=document.createElement('span');state.id='cloudState';state.setAttribute('role','status');state.setAttribute('aria-live','polite');state.style.cssText='font-size:12px;flex-basis:100%;text-align:center;color:#625075';document.querySelector('nav').append(state);
function status(text){state.textContent=text;}
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(error){return null;}}
function student(){return read('page1Data')||read('energyAssessmentStudent')||{};}
function identity(s=student()){return [s.school,s.grade,s.classNumber||s.classNo,s.studentNumber||s.number].map(v=>String(v||'').trim()).join('|');}
function identified(s=student()){return !!(s.school&&s.grade&&(s.classNumber||s.classNo)&&(s.studentNumber||s.number)&&(s.studentName||s.name)&&(s.groupNumber||s.group));}
function collect(){const pages={};for(let i=1;i<=6;i++){const data=read('page'+i+'Data');if(data)pages['page'+i]=data;}return pages;}
let timer,retryTimer,activeSave=null,submitting=false,retryDelay=5000,serial=0,peerBusy=false,lastPeerAt=0;
let last=read(LAST),marker=read(OUTBOX),failedJob=marker?.attempt||null;
const photoCache=read(PHOTOS)||{},photoHashes=new Map();
function pending(){return marker?.pending&&marker.identity===identity();}
function storeMarker(){localStorage.setItem(OUTBOX,JSON.stringify(marker));}
function markPending(source=current){if(!identified())return;marker={pending:true,identity:identity(),revision:Date.now()+'_'+(++serial),page:source,updatedAt:new Date().toISOString(),attempt:failedJob};storeMarker();}
function saveLocal(){const win=frame.contentWindow;if(current==='complete')return true;if(current==='index'&&typeof win.validate==='function'&&!win.validate())return false;return typeof win.saveDraft==='function'?win.saveDraft():typeof win.save==='function'?win.save():false;}
async function sha(text){const data=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(data),n=>n.toString(16).padStart(2,'0')).join('');}
async function fingerprint(pages){const copy=JSON.parse(JSON.stringify(pages));for(const k of ['member1','member2','member3','member4'])if(copy.page2)delete copy.page2[k];for(const k of ['before','reflection1','reflection2','reflection3','reflection4'])if(copy.page6)delete copy.page6[k];return sha(JSON.stringify(copy));}
async function prepared(pages,who){const output=JSON.parse(JSON.stringify(pages)),hashes={};for(const name of ['page2','page3','page4']){const art=pages[name]?.art;if(typeof art!=='string'||!art.startsWith('data:image/'))continue;let hash=photoHashes.get(art);if(!hash){hash=await sha(art);photoHashes.set(art,hash);}hashes[name]=hash;const cached=photoCache[who+'|'+name];if(cached?.hash===hash&&/^https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/view$/.test(cached.url))output[name].art=cached.url;}return {pages:output,hashes};}
function requestId(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2)).replace(/-/g,'_');}
async function post(data,timeoutMs=60000){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),timeoutMs);try{const response=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data),redirect:'follow',credentials:'omit',signal:controller.signal});if(!response.ok)throw Error('서버 응답 '+response.status);const result=await response.json();if(!result.ok)throw Error(result.error||'시트 저장 실패');return result;}finally{clearTimeout(timeout);}}
async function syncOnce(action,pages,source,revision){
 const s=student(),who=identity(s);if(!identified(s))throw Error('첫 페이지의 학생 정보를 확인해 주세요.');
 const hash=await fingerprint(pages);
 if(action==='save'&&last?.identity===who&&last.hash===hash){if(marker?.revision===revision){marker=null;localStorage.removeItem(OUTBOX);}if(!pending())status('구글 시트 저장 완료');return {ok:true,unchanged:true};}
 if(!failedJob||failedJob.identity!==who||failedJob.hash!==hash||failedJob.action!==action)failedJob={identity:who,hash,action,id:requestId()};
 const job=failedJob;if(marker?.identity===who){marker.attempt=job;storeMarker();}
 const photo=await prepared(pages,who);
 status(action==='submit'?'최종 제출 중입니다…':'기기에 저장됨 · 시트에 저장 중…');
 const result=await post({action,requestId:job.id,student:s,pages:photo.pages,page:source});
 // 사진 원본은 기기에 유지하고, 이후 전송에서는 이미 저장한 Drive 링크만 보냅니다.
 for(const [name,url]of Object.entries(result.artUrls||{}))if(photo.hashes[name]&&/^https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/view$/.test(url))photoCache[who+'|'+name]={hash:photo.hashes[name],url};
 try{localStorage.setItem(PHOTOS,JSON.stringify(photoCache));}catch(error){}
 last={identity:who,hash,savedAt:result.savedAt};localStorage.setItem(LAST,JSON.stringify(last));
 if(failedJob===job)failedJob=null;
 if(marker?.identity===who&&marker.revision===revision){marker=null;localStorage.removeItem(OUTBOX);}
 retryDelay=5000;
 status(pending()?'기기에 저장됨 · 다음 내용을 시트에 저장 중…':'구글 시트 저장 완료 · '+result.savedAt);
 return result;
}
function pump(){
 if(activeSave||submitting||!pending()||!identified())return activeSave||Promise.resolve();
 clearTimeout(timer);clearTimeout(retryTimer);
 activeSave=(async()=>{while(!submitting&&pending()){
  const item=marker,pages=collect();
  try{await syncOnce('save',pages,item.page,item.revision);}
  catch(error){status('기기에 저장됨 · 시트 저장을 다시 시도합니다. '+error.message);retryTimer=setTimeout(pump,retryDelay);retryDelay=Math.min(retryDelay*2,30000);break;}
 }})().finally(()=>{activeSave=null;});return activeSave;
}
function queueSave(delay=2500){if(submitting||!identified())return;try{markPending();}catch(error){status('기기 저장 공간을 확인해 주세요.');return;}clearTimeout(timer);timer=setTimeout(pump,delay);}
function applyPeers(peers,page,doc){if(current!==page||frame.contentDocument!==doc)return;const win=frame.contentWindow;if(page==='page2'&&typeof win.setSharedThoughts==='function')win.setSharedThoughts(peers.map(p=>p.before?p.name+': '+p.before:''));if(page==='page6'&&typeof win.setSharedReflections==='function')win.setSharedReflections(peers.map(p=>p.after?p.name+': '+p.after:''));}
async function refreshPeers(){
 if(!identified()||peerBusy||document.hidden||submitting||!['page2','page6'].includes(current)||Date.now()-lastPeerAt<12000)return;
 const page=current,doc=frame.contentDocument,who=identity();peerBusy=true;lastPeerAt=Date.now();
 try{const response=await post({action:'peers',student:student()},15000);if(identity()===who)applyPeers(response.peers||[],page,doc);}catch(error){/* 조회 실패는 저장이나 페이지 이동을 막지 않습니다. */}finally{peerBusy=false;}
}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||(e.data?.page&&e.data.page!==current))return;if(e.data?.kind==='draft'&&String(e.data.text).includes('임시저장 완료'))queueSave();});
frame.addEventListener('load',()=>{refreshPeers();if(pending())setTimeout(pump,0);});setInterval(refreshPeers,15000);
window.addEventListener('online',()=>{retryDelay=5000;pump();refreshPeers();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pending())pump();refreshPeers();}});
window.addEventListener('beforeunload',event=>{if(pending()||activeSave||submitting){event.preventDefault();event.returnValue='';}});
window.requestPageNavigation=function(target){
 if(!PAGES[target]||submitting)return;
 try{if(!saveLocal())return;if(identified())markPending(current);}catch(error){status('기기에 저장하지 못했습니다. 저장 공간을 확인해 주세요.');return;}
 openPage(target);if(pending()){status('기기에 저장됨 · 시트에 저장 중…');setTimeout(pump,0);}
};
document.getElementById('forward').onclick=()=>window.requestPageNavigation(order[order.indexOf(current)+1]);
document.getElementById('previous').onclick=()=>window.requestPageNavigation(order[order.indexOf(current)-1]);
select.onchange=()=>window.requestPageNavigation(select.value);
document.getElementById('manualSave').onclick=()=>{try{if(saveLocal()){markPending();pump();}}catch(error){status('기기 저장 공간을 확인해 주세요.');}};
window.submitAssessment=async function(pages){
 if(submitting)return;submitting=true;clearTimeout(timer);clearTimeout(retryTimer);
 const submitButton=frame.contentDocument?.getElementById('submit');if(submitButton)submitButton.disabled=true;
 try{
  // 진행 중이던 저장 한 건만 끝낸 뒤 최종 스냅샷을 제출합니다. 모둠원 조회는 기다리지 않습니다.
  if(activeSave)await activeSave;
  markPending(current);const rev=marker?.revision;const result=await syncOnce('submit',pages,current,rev);
  localStorage.setItem('energySubmissionReceipt',JSON.stringify({savedAt:result.savedAt,firstSubmittedAt:result.firstSubmittedAt,lastSubmittedAt:result.lastSubmittedAt,submissionType:'google-sheets',pages}));
  openPage('complete');
 }catch(error){status('최종 제출하지 못했습니다. 답안은 기기에 남아 있습니다. '+error.message);throw error;}
 finally{submitting=false;if(submitButton)submitButton.disabled=false;}
};
status(pending()?'기기의 미전송 답안을 시트에 저장합니다.':'작성하면 구글 시트에 자동 저장됩니다.');
if(identified()){if(!pending())queueSave();else setTimeout(pump,0);}
})();
